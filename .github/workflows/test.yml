name: test
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {repository: ilkermansur/nicegui-core-plugins, path: core-plugins}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "ngui[dev] @ git+https://github.com/ilkermansur/nicegui-core@main" pytest-asyncio "sqlalchemy>=2"
      - run: pytest -q
        env: {NGUI_CORE_PLUGINS: core-plugins}
