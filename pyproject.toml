[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
# The repo root is the plugin package itself (its __init__.py uses relative imports and only loads
# inside ngui). Starting collection at tests/ keeps pytest from importing it as a test package.
addopts = "--rootdir=tests --confcutdir=tests -p no:cacheprovider"
